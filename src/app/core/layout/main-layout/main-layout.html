<div class="min-h-screen bg-slate-100 text-slate-900">
  <app-sidebar [items]="navItems" (createTask)="taskDialog.openCreate()" />

  <app-header
    [searchTerm]="taskStore.searchTerm()"
    [language]="translations.language()"
    [currentUser]="currentUser"
    (searchChange)="onSearch($event)"
    (languageChange)="translations.setLanguage($event)"
    (notificationsClick)="showNotifications()"
  />

  <main class="pt-14 ps-16 lg:ps-56">
    <div class="mx-auto max-w-[1440px] p-4 lg:p-6">
      <router-outlet />
    </div>
  </main>
</div>
