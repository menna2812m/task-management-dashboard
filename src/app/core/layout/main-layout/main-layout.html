<div class="min-h-screen bg-slate-100 text-slate-900">
  <aside
    class="fixed inset-y-0 left-0 z-20 flex w-16 flex-col border-r border-slate-200 bg-white lg:w-56"
  >
    <a
      routerLink="/dashboard"
      class="flex h-14 items-center gap-2.5 border-b border-slate-200 px-4 focus-visible:outline-2 focus-visible:outline-brand-600 lg:px-5"
    >
      <span
        class="grid size-7 shrink-0 place-items-center rounded-md bg-brand-600 text-white"
        aria-hidden="true"
      >
        <img src="icons/clipboard.png" alt="" width="16" height="16" class="glyph" />
      </span>
      <span class="hidden truncate text-[15px] font-semibold text-brand-700 lg:inline">
        {{ translations.translate('taskManager') }}
      </span>
    </a>

    <nav class="space-y-1 px-2 py-3 lg:px-3" aria-label="Main">
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="nav-link--active"
            class="nav-link"
            [title]="translations.translate(item.label.toLowerCase())"
          >
            <span class="emoji" aria-hidden="true">{{ item.emoji }}</span>
            <span class="nav-link__label hidden lg:inline">{{
              translations.translate(item.label.toLowerCase())
            }}</span>
          </a>
        } @else {
          <span
            class="nav-link nav-link--disabled"
            aria-disabled="true"
            [title]="translations.translate(item.label.toLowerCase()) + ' is coming soon'"
          >
            <span class="emoji" aria-hidden="true">{{ item.emoji }}</span>
            <span class="nav-link__label hidden lg:inline">{{
              translations.translate(item.label.toLowerCase())
            }}</span>
          </span>
        }
      }
    </nav>

    <div class="px-2 lg:px-3">
      <button
        type="button"
        class="btn-primary w-full cursor-pointer"
        (click)="taskDialog.openCreate()"
      >
        <app-icon name="plus" [size]="14" />
        <span class="hidden lg:inline">{{ translations.translate('newTask') }}</span>
        <span class="sr-only lg:hidden">{{ translations.translate('newTask') }}</span>
      </button>
    </div>

    <div class="flex-1"></div>
  </aside>

  <header
    class="fixed inset-x-0 top-0 z-10 flex h-14 items-center gap-4 border-b border-slate-200 bg-white pr-4 pl-20 lg:pr-6 lg:pl-60"
  >
    <div class="flex flex-1 justify-center">
      <label class="relative block w-full max-w-md">
        <span class="sr-only">{{ translations.translate('search') }}</span>
        <app-icon
          name="search"
          [size]="14"
          class="header-search-icon pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400"
        />
        <input
          type="search"
          [placeholder]="translations.translate('searchTasks')"
          class="app-input app-input--compact header-search-input h-8 w-full pr-3 pl-8 text-xs placeholder:text-slate-400"
          [value]="taskStore.searchTerm()"
          (input)="onSearch($event)"
        />
      </label>
    </div>

    <div class="flex items-center gap-3">
      <button
        type="button"
        class="grid size-8 cursor-pointer place-items-center rounded-md text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
        [attr.aria-label]="translations.translate('notifications')"
        (click)="showNotifications()"
      >
        <img src="icons/bell.png" alt="" width="20" height="20" class="glyph" />
      </button>
      <button
        type="button"
        class="btn-secondary cursor-pointer"
        (click)="translations.setLanguage(translations.language() === 'en' ? 'ar' : 'en')"
      >
        {{
          translations.language() === 'en'
            ? translations.translate('arabic')
            : translations.translate('english')
        }}
      </button>
      <span
        class="grid size-8 place-items-center rounded-full bg-brand-600 text-xs font-semibold text-white"
        [attr.aria-label]="'Signed in as ' + currentUser.name"
        role="img"
      >
        {{ currentUser.avatar }}
      </span>
    </div>
  </header>

  <main class="pt-14 pl-16 lg:pl-56">
    <div class="mx-auto max-w-[1440px] p-4 lg:p-6">
      <router-outlet />
    </div>
  </main>
</div>
