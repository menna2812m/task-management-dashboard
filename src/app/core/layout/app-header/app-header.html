<header
  class="fixed inset-x-0 top-0 z-10 flex h-14 items-center gap-2 border-b border-slate-200 bg-white pe-4 ps-20 sm:gap-4 lg:pe-6 lg:ps-60"
>
  <div class="flex min-w-0 flex-1 justify-center">
    <label class="relative block w-full max-w-md">
      <span class="sr-only">{{ 'search' | translate }}</span>
      <app-icon
        name="search"
        [size]="14"
        class="header-search-icon pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400"
      />
      <input
        type="search"
        [placeholder]="'searchTasks' | translate"
        class="app-input app-input--compact header-search-input h-8 w-full pr-3 pl-8 text-xs placeholder:text-slate-400"
        [value]="searchTerm()"
        (input)="onSearch($event)"
      />
    </label>
  </div>

  <div class="flex items-center gap-3">
    <button
      type="button"
      class="grid size-8 cursor-pointer place-items-center rounded-md text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
      [attr.aria-label]="'notifications' | translate"
      (click)="notificationsClick.emit()"
    >
      <img src="icons/bell.png" alt="" width="20" height="20" class="glyph" />
    </button>
    <button type="button" class="btn-secondary cursor-pointer" (click)="toggleLanguage()">
      {{ (language() === 'en' ? 'arabic' : 'english') | translate }}
    </button>
    <span
      class="grid size-8 place-items-center rounded-full bg-brand-600 text-xs font-semibold text-white"
      [attr.aria-label]="('signedInAs' | translate) + ' ' + currentUser().name"
      role="img"
    >
      {{ currentUser().avatar }}
    </span>
  </div>
</header>
