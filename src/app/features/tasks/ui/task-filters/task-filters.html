<form
  [formGroup]="filtersForm"
  aria-label="Task filters"
  class="task-filter-panel grid gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm md:grid-cols-2 xl:grid-cols-5"
>
  <label class="filter-control">
    <span>{{ 'search' | translate }}</span>
    <input class="app-input" type="search" formControlName="searchTerm" />
  </label>

  <label class="filter-control">
    <span>{{ 'status' | translate }}</span>
    <select class="app-input" formControlName="status">
      <option value="all">{{ 'allStatuses' | translate }}</option>
      <option value="todo">{{ 'todo' | translate }}</option>
      <option value="in_progress">{{ 'inProgress' | translate }}</option>
      <option value="done">{{ 'done' | translate }}</option>
    </select>
  </label>

  <label class="filter-control">
    <span>{{ 'priority' | translate }}</span>
    <select class="app-input" formControlName="priority">
      <option value="all">{{ 'allPriorities' | translate }}</option>
      <option value="low">{{ 'low' | translate }}</option>
      <option value="medium">{{ 'medium' | translate }}</option>
      <option value="high">{{ 'high' | translate }}</option>
    </select>
  </label>

  <label class="filter-control">
    <span>{{ 'assignee' | translate }}</span>
    <select class="app-input" formControlName="assigneeId">
      <option value="all">{{ 'allAssignees' | translate }}</option>

      @for (assignee of assignees(); track assignee.id) {
        <option [value]="assignee.id">{{ assignee.name }}</option>
      }
    </select>
  </label>

  <button
    mat-stroked-button
    type="button"
    class="filter-clear self-center"
    (click)="resetFilters()"
  >
    {{ 'clearFilters' | translate }}
  </button>
</form>
