<section
  aria-label="Task filters"
  class="grid gap-4 rounded-xl bg-white p-4 shadow-sm md:grid-cols-2 xl:grid-cols-5"
>
  <mat-form-field appearance="outline">
    <mat-label>Search tasks</mat-label>
    <input matInput type="search" [value]="searchTerm()" (input)="onSearch($event)" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select [value]="status()" (valueChange)="statusChange.emit($event)">
      <mat-option value="all">All statuses</mat-option>
      <mat-option value="todo">To do</mat-option>
      <mat-option value="in_progress">In progress</mat-option>
      <mat-option value="done">Done</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Priority</mat-label>
    <mat-select [value]="priority()" (valueChange)="priorityChange.emit($event)">
      <mat-option value="all">All priorities</mat-option>
      <mat-option value="low">Low</mat-option>
      <mat-option value="medium">Medium</mat-option>
      <mat-option value="high">High</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Assignee</mat-label>
    <mat-select [value]="assigneeId()" (valueChange)="assigneeChange.emit($event)">
      <mat-option value="all">All assignees</mat-option>

      @for (assignee of assignees(); track assignee.id) {
        <mat-option [value]="assignee.id">{{ assignee.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="button" class="self-center" (click)="clearFilters.emit()">
    Clear filters
  </button>
</section>
