<section
  class="flex h-full flex-col rounded-xl border border-grey-88 bg-white p-4"
  [attr.aria-labelledby]="headingId"
>
  <header class="flex items-baseline justify-between border-b-2 border-grey-88 px-1 pb-1">
    <h2 [id]="headingId" class="text-[11px] font-bold tracking-wide text-grey-13 uppercase">
      {{ title() }}
    </h2>
    <span data-testid="chart-total" class="text-[11px] text-slate-500">
      {{ total() }} {{ total() === 1 ? 'task' : 'tasks' }}
    </span>
  </header>

  @if (total() > 0) {
    <div class="mt-3 flex items-center gap-5">
      <div class="relative h-32 w-32 shrink-0">
        <canvas #canvas aria-hidden="true"></canvas>
      </div>
      <ul class="flex-1 space-y-2 text-xs">
        @for (slice of slices(); track slice.label) {
          <li class="flex items-center justify-between gap-3">
            <span class="flex items-center gap-2 text-slate-500">
              <span
                class="size-2.5 rounded-full"
                [style.background-color]="slice.color"
                aria-hidden="true"
              ></span>
              {{ slice.label }}
            </span>
            <span class="font-semibold text-grey-13">{{ slice.value }}</span>
          </li>
        }
      </ul>
    </div>
  } @else {
    <p
      class="mt-3 rounded-lg border border-dashed border-slate-200 px-3 py-8 text-center text-xs text-slate-400"
    >
      No tasks to chart yet.
    </p>
  }
</section>
