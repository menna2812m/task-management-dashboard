services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    expose:
      - '3000'
    volumes:
      # JSON Server writes through a temporary file and atomic rename. Mount the directory
      # so that operation works on Docker Desktop for Windows.
      - ./mock-api:/app/mock-api
    restart: unless-stopped
